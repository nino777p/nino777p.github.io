<svg xmlns="http://www.w3.org/2000/svg" width="444" height="1235" viewBox="0 0 444 1235" role="img" aria-labelledby="titre description">
<title id="titre">Quatre implantations le long d’un mur de 3,80 m</title>
<desc id="description">Vues de dessus à la même échelle. Les tronçons cotés indiquent le mur libre à côté du canapé. Le trait épais du meuble indique le dossier. Le fauteuil de la dernière vue fait face au canapé.</desc>
<rect width="444" height="1235" fill="#fcfaf6"/><text font-family="Arial, sans-serif" fill="#263b35" x="24" y="33" font-size="18" font-weight="bold">Vue de dessus · Mur libre de 380 cm</text>
<g stroke="#cecfc5" stroke-width="1"><path d="M24 52 H420 M24 246 H420 M24 526 H420 M24 872 H420"/></g>
<g transform="translate(0 83)"><text font-family="Arial, sans-serif" fill="#263b35" font-size="20" font-weight="bold" x="24" y="0">Canapé droit</text><text font-family="Arial, sans-serif" fill="#263b35" font-size="16" x="24" y="24">240 × 95 cm</text><g transform="translate(28 53) scale(1.02)"><path stroke="#263b35" stroke-width="4" d="M0 -3 H380"/><path fill="none" stroke="#486357" stroke-width="1.4" d="M243 19 H377 M243 14 v10 M377 14 v10"/><text font-family="Arial, sans-serif" fill="#263b35" font-size="16" x="310" y="41" text-anchor="middle">140 cm</text><rect fill="#dce8e0" stroke="#35574a" stroke-width="1.6" stroke-linejoin="round" width="240" height="95" rx="3"/><path fill="none" stroke="#587966" stroke-width="6" stroke-linecap="round" d="M8 12 H232"/><path fill="none" stroke="#8da99b" stroke-width="1" stroke-linecap="round" d="M120 13 V93"/></g></g>
<g transform="translate(0 282)"><text font-family="Arial, sans-serif" fill="#263b35" font-size="20" font-weight="bold" x="24" y="0">Canapé avec méridienne</text><text font-family="Arial, sans-serif" fill="#263b35" font-size="16" x="24" y="24">280 × 160 cm</text><g transform="translate(28 53) scale(1.02)"><path stroke="#263b35" stroke-width="4" d="M0 -3 H380"/><path fill="none" stroke="#486357" stroke-width="1.4" d="M283 19 H377 M283 14 v10 M377 14 v10"/><text font-family="Arial, sans-serif" fill="#263b35" font-size="16" x="330" y="41" text-anchor="middle">100 cm</text><path fill="#dce8e0" stroke="#35574a" stroke-width="1.6" stroke-linejoin="round" d="M0 0 H280 V95 H95 V160 H0 Z"/><path fill="none" stroke="#587966" stroke-width="6" stroke-linecap="round" d="M8 12 H272"/><path fill="none" stroke="#8da99b" stroke-width="1" stroke-linecap="round" d="M95 13 V93 M186 13 V94"/></g></g>
<g transform="translate(0 566)"><text font-family="Arial, sans-serif" fill="#263b35" font-size="20" font-weight="bold" x="24" y="0">Angle avec assises en retour</text><text font-family="Arial, sans-serif" fill="#263b35" font-size="16" x="24" y="24">280 × 220 cm</text><g transform="translate(28 53) scale(1.02)"><path stroke="#263b35" stroke-width="4" d="M0 -3 H380"/><path fill="none" stroke="#486357" stroke-width="1.4" d="M283 19 H377 M283 14 v10 M377 14 v10"/><text font-family="Arial, sans-serif" fill="#263b35" font-size="16" x="330" y="41" text-anchor="middle">100 cm</text><path fill="#dce8e0" stroke="#35574a" stroke-width="1.6" stroke-linejoin="round" d="M0 0 H280 V95 H95 V220 H0 Z"/><path fill="none" stroke="#587966" stroke-width="6" stroke-linecap="round" d="M8 12 H272 M11 13 V211"/><path fill="none" stroke="#8da99b" stroke-width="1" stroke-linecap="round" d="M12 95 H94 M12 157 H94 M186 13 V94"/></g></g>
<g transform="translate(0 920)"><text font-family="Arial, sans-serif" fill="#263b35" font-size="20" font-weight="bold" x="24" y="0">Canapé droit et fauteuil en face</text><text font-family="Arial, sans-serif" fill="#263b35" font-size="16" x="24" y="24">220 × 95 cm + fauteuil de 80 × 85 cm</text><g transform="translate(28 53) scale(1.02)"><path stroke="#263b35" stroke-width="4" d="M0 -3 H380"/><path fill="none" stroke="#486357" stroke-width="1.4" d="M223 19 H377 M223 14 v10 M377 14 v10"/><text font-family="Arial, sans-serif" fill="#263b35" font-size="16" x="300" y="41" text-anchor="middle">160 cm</text><rect fill="#dce8e0" stroke="#35574a" stroke-width="1.6" stroke-linejoin="round" width="220" height="95" rx="3"/><path fill="none" stroke="#587966" stroke-width="6" stroke-linecap="round" d="M8 12 H212"/><path fill="none" stroke="#8da99b" stroke-width="1" stroke-linecap="round" d="M110 13 V93"/><g transform="translate(203 147)"><rect fill="#dce8e0" stroke="#35574a" stroke-width="1.6" stroke-linejoin="round" width="80" height="85" rx="5"/><path fill="none" stroke="#587966" stroke-width="6" stroke-linecap="round" d="M8 74 H72"/><path fill="none" stroke="#8da99b" stroke-width="1" stroke-linecap="round" d="M8 10 V60 M72 10 V60"/></g></g></g>
</svg>
